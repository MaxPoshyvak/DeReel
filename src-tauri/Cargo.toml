[package]
name = "dereel"
version = "0.1.0"
description = "Open-source, 100% private AI video restoration & upscaling"
authors = ["Max Poshyvak"]
edition = "2021"
default-run = "DeReel"

[[bin]]
name = "DeReel"
path = "src/main.rs"

[lib]
name = "dereel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
